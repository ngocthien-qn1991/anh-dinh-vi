<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ảnh Định Vị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Bố cục: một cột kiểu công cụ hiện trường, nền tối như máy ảnh, điểm nhấn vàng hổ phách giống dấu đóng ảnh */
:root{
  --bg:#14161a; --panel:#1d2026; --line:#2c3038; --fg:#eef0f3; --muted:#9aa1ad;
  --accent:#ffc22e; --accent-ink:#1a1400; --ok:#3ccf8e; --warn:#ffb347; --bad:#ff6b6b;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-block:env(safe-area-inset-top,0) calc(24px + env(safe-area-inset-bottom,0));padding-inline:16px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;padding-top:14px}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px;flex:1}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.3px}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#262a31;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=url]{width:100%;background:#15171c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:#262a31;color:var(--fg);padding:11px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,.iconbtn:focus-visible,.shoot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.small{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shoot{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;border:0;border-radius:16px;padding:18px;cursor:pointer}
.shoot svg{width:26px;height:26px}
#preview{width:100%;border-radius:12px;display:block;background:#000}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.warn{color:var(--warn)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#000}
.hist .t{font-weight:600;font-size:14px}
.hist .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist div{min-width:0}
.empty{color:var(--muted);font-size:13px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(520px,calc(100% - 24px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Ảnh Định Vị<small>Chụp ảnh đóng dấu thời gian và vị trí</small></div>
    <button class="iconbtn" id="openSettings" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="card" aria-labelledby="locLabel">
    <div class="row" style="justify-content:space-between">
      <span class="label" id="locLabel">Vị trí hiện tại</span>
      <span class="pill warn" id="gpsPill"><i></i><span>Đang tìm GPS…</span></span>
    </div>
    <div class="mono" id="coords">—, —</div>
    <textarea id="address" rows="2" placeholder="Địa chỉ sẽ tự điền khi có GPS. Bạn có thể sửa tay."></textarea>
    <div class="row">
      <button class="btn small" id="refreshLoc" type="button">Cập nhật vị trí</button>
      <span class="hint" id="addrHint"></span>
    </div>
  </section>

  <section class="card">
    <label class="label" for="note">Ghi chú</label>
    <textarea id="note" rows="2" placeholder="Ví dụ: Kiểm tra lắp đặt máy tính quầy 1"></textarea>
  </section>

  <button class="shoot" id="shootBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Chụp ảnh
  </button>
  <input type="file" id="camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="gallery" accept="image/*" hidden>
  <button class="btn small" id="pickBtn" type="button" style="align-self:center;background:transparent;border-color:transparent;color:var(--muted)">hoặc chọn ảnh có sẵn</button>

  <section class="card" id="resultCard" hidden>
    <span class="label">Ảnh vừa chụp</span>
    <img id="preview" alt="Ảnh đã đóng dấu">
    <div class="status" id="syncStatus"></div>
    <div class="btns">
      <button class="btn" id="saveBtn" type="button">Lưu ảnh</button>
      <button class="btn" id="shareBtn" type="button">Chia sẻ</button>
      <button class="btn primary" id="againBtn" type="button">Chụp tiếp</button>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <span class="label">Lịch sử gần đây</span>
      <button class="btn small" id="retryBtn" type="button" hidden>Gửi lại <span id="queueCount"></span></button>
    </div>
    <ul class="hist" id="hist"></ul>
    <p class="empty" id="histEmpty">Chưa có ảnh nào. Bấm “Chụp ảnh” để bắt đầu.</p>
  </section>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <strong style="font-size:17px">Cài đặt</strong>
    <div>
      <label class="label" for="sUrl">Đường dẫn Google Apps Script</label>
      <input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec">
      <p class="hint">Dán đường dẫn Web app sau khi triển khai Code.gs (xem hướng dẫn).</p>
    </div>
    <div>
      <label class="label" for="sUser">Tên người chụp</label>
      <input type="text" id="sUser" placeholder="Nguyễn Văn A">
    </div>
    <div>
      <span class="label">Logo trên ảnh (tùy chọn)</span>
      <div class="row" style="margin-top:6px">
        <button class="btn small" type="button" id="logoPick">Chọn logo</button>
        <button class="btn small" type="button" id="logoClear">Bỏ logo</button>
        <span class="hint" id="logoState"></span>
      </div>
      <input type="file" id="logoFile" accept="image/*" hidden>
    </div>
    <label class="check"><input type="checkbox" id="sUpload" checked><span>Tải ảnh lên Google Drive và ghi đường dẫn vào Sheet</span></label>
    <label class="check"><input type="checkbox" id="sAutoSave" checked><span>Tự động lưu ảnh về máy sau khi chụp</span></label>
    <div class="row" style="justify-content:space-between">
      <button class="btn small" type="button" id="testBtn">Kiểm tra kết nối</button>
      <span class="hint" id="testResult"></span>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" formnovalidate>Đóng</button>
      <button class="btn primary" value="save" id="saveSettings">Lưu</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const WEEKDAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const pad = n => String(n).padStart(2,'0');

/* ---------- Lưu trữ cục bộ ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let settings = Object.assign({url:'', user:'', upload:true, autoSave:true}, store.get('settings', {}));
let history = store.get('history', []);   // {id,time,address,status,thumb}
let queue = store.get('queue', []);       // payload chờ gửi

function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }

/* ---------- Kết nối mạng (qua Android nếu có, tránh lỗi CORS) ---------- */
const _httpWait = {}; let _httpSeq = 0;
window.__nativeHttpDone = (id, status, text) => { const w=_httpWait[id]; if(w){ delete _httpWait[id]; w({status, text}); } };
async function http(method, url, body){
  if(window.AndroidBridge && window.AndroidBridge.http){
    const id = 'h'+(++_httpSeq);
    const res = await new Promise(r=>{ _httpWait[id]=r; window.AndroidBridge.http(id, method, url, body||''); });
    if(res.status===0) throw new Error(res.text||'mất kết nối');
    return res;
  }
  const r = await fetch(url, method==='POST' ? {method, headers:{'Content-Type':'text/plain;charset=utf-8'}, body} : {});
  return {status:r.status, text: await r.text()};
}
function parseJson(res){
  try{ return JSON.parse(res.text); }
  catch(e){
    const t = res.text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,140);
    throw new Error('Google trả về HTTP '+res.status+(t?': '+t:''));
  }
}

/* ---------- GPS & địa chỉ ---------- */
let pos = null, lastGeoAt = null, geoTimer = null, addrEdited = false;
$('address').addEventListener('input', ()=>{ addrEdited = true; $('addrHint').textContent='Đã sửa tay'; });

function setPill(cls, text){ const p=$('gpsPill'); p.className='pill '+cls; p.lastElementChild.textContent=text; }

function distM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function startGPS(){
  if(!('geolocation' in navigator)){ setPill('bad','Máy không hỗ trợ GPS'); return; }
  navigator.geolocation.watchPosition(p=>{
    const n = {lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy)};
    pos = n;
    $('coords').textContent = n.lat.toFixed(6)+', '+n.lng.toFixed(6)+'  ±'+n.acc+' m';
    setPill(n.acc<=30?'ok':'warn', n.acc<=30?'GPS tốt ±'+n.acc+' m':'GPS yếu ±'+n.acc+' m');
    if(!lastGeoAt || distM(lastGeoAt,n) > 40){ scheduleGeocode(); }
  }, err=>{
    const m = err.code===1 ? 'Chưa cho phép vị trí' : err.code===3 ? 'GPS quá lâu, thử lại' : 'Không lấy được vị trí';
    setPill('bad', m);
    if(err.code===1) $('addrHint').textContent='Vào cài đặt trình duyệt, cho phép trang này dùng vị trí.';
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
}

function scheduleGeocode(force){
  clearTimeout(geoTimer);
  geoTimer = setTimeout(()=>geocode(force), 1200);
}

async function geocode(force){
  if(!pos) return;
  if(addrEdited && !force) return;
  const here = {...pos};
  $('addrHint').textContent='Đang tra địa chỉ…';
  try{
    const res = await http('GET','https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=vi&lat='+here.lat+'&lon='+here.lng);
    if(res.status!==200) throw new Error(res.status);
    const j = JSON.parse(res.text);
    $('address').value = formatAddress(j);
    lastGeoAt = here; addrEdited = false;
    $('addrHint').textContent='Tự động theo GPS';
  }catch(e){
    $('addrHint').textContent = navigator.onLine ? 'Không tra được địa chỉ, có thể nhập tay.' : 'Đang offline, có thể nhập tay.';
  }
}

function formatAddress(j){
  const a = j.address || {};
  const parts = [];
  const street = [a.house_number, a.road].filter(Boolean).join(' ');
  [a.amenity||a.building||a.office||a.shop, street, a.hamlet||a.neighbourhood, a.quarter||a.suburb||a.village,
   a.city_district||a.town||a.county, a.city||a.state].forEach(x=>{ if(x && !parts.includes(x)) parts.push(x); });
  if(parts.length >= 2) return parts.join(', ');
  return (j.display_name||'').replace(/,\s*\d{5,6}/,'').replace(/,\s*Việt Nam$/,'');
}

$('refreshLoc').addEventListener('click', ()=>{
  addrEdited=false; lastGeoAt=null;
  if(!pos){ setPill('warn','Đang tìm GPS…'); return; }
  geocode(true);
});

/* ---------- Chụp & đóng dấu ---------- */
$('shootBtn').addEventListener('click', ()=>$('camera').click());
$('pickBtn').addEventListener('click', ()=>$('gallery').click());
$('againBtn').addEventListener('click', ()=>$('camera').click());
$('camera').addEventListener('change', onFile);
$('gallery').addEventListener('change', onFile);

let current = null;
let logoImg = null;
function loadLogo(){ const src=store.get('logo',''); logoImg=null; if(src){ const i=new Image(); i.onload=()=>logoImg=i; i.src=src; } $('logoState').textContent = src?'Đã có logo':'Chưa có logo'; } // {blob, fileName, payload}

async function onFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const now = new Date();
  try{
    await document.fonts.load('800 40px "Be Vietnam Pro"').catch(()=>{});
    const img = await loadImage(file);
    const data = {
      now,
      time: pad(now.getHours())+':'+pad(now.getMinutes()),
      date: pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear(),
      weekday: WEEKDAYS[now.getDay()],
      address: $('address').value.trim(),
      lat: pos ? pos.lat : null, lng: pos ? pos.lng : null, acc: pos ? pos.acc : null,
      note: $('note').value.trim(), user: settings.user.trim()
    };
    const canvas = stamp(img, data);
    const blob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.9));
    const stampStr = now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
    const fileName = 'ANH_'+stampStr+'.jpg';
    const id = stampStr+'_'+Math.random().toString(36).slice(2,7);

    if(current && current.url) URL.revokeObjectURL(current.url);
    current = {blob, fileName, url:URL.createObjectURL(blob)};
    $('preview').src = current.url;
    $('resultCard').hidden = false;
    $('resultCard').scrollIntoView({behavior:'smooth', block:'start'});

    if(settings.autoSave) saveBlob(blob, fileName);

    const thumb = makeThumb(canvas);
    const payload = {
      id, timestamp: now.toISOString(), date:data.date, time: data.time+':'+pad(now.getSeconds()),
      weekday:data.weekday, user:data.user, address:data.address,
      lat:data.lat, lng:data.lng, accuracy:data.acc, note:data.note, fileName
    };
    if(settings.upload) payload.image = await blobToBase64(await shrink(canvas, 1600));
    history.unshift({id, time:data.time+' · '+data.date, address:data.address||'(chưa có địa chỉ)', status:'pending', thumb});
    history = history.slice(0,20);
    saveHistory(); renderHistory();
    send(payload);
  }catch(err){
    toast('Không xử lý được ảnh: '+err.message);
  }
}

function loadImage(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ res(img); setTimeout(()=>URL.revokeObjectURL(url), 1000); };
    img.onerror = ()=>rej(new Error('ảnh không đọc được'));
    img.src = url;
  });
}

function wrapLines(ctx, text, maxW){
  const words = text.split(/\s+/); const lines=[]; let line='';
  for(const w of words){
    const t = line ? line+' '+w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line=w; } else line=t;
  }
  if(line) lines.push(line);
  return lines;
}

function stamp(img, d){
  const MAX = 2400;
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, MAX/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img,0,0,w,h);

  const s = Math.min(w,h)/1080;            // hệ số tỉ lệ theo cạnh ngắn
  const F = '"Be Vietnam Pro", system-ui, sans-serif';
  const m = 30*s;                            // lề
  const fs = 40*s, lineH = 56*s;
  const maxW = w*0.78;

  // 1. Ô tọa độ góc trên trái
  if(d.lat!=null){
    const txt = Math.abs(d.lat).toFixed(6)+'°'+(d.lat>=0?'N':'S')+', '+Math.abs(d.lng).toFixed(6)+'°'+(d.lng>=0?'E':'W');
    ctx.font = `500 ${36*s}px ${F}`;
    const tw = ctx.measureText(txt).width, ph = 64*s, pw = tw + 96*s, py = m + 60*s;
    ctx.fillStyle='rgba(0,0,0,0.42)'; roundRect(ctx, m, py, pw, ph, 10*s); ctx.fill();
    drawPin(ctx, m+38*s, py+ph/2, 15*s);
    ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(txt, m+70*s, py+ph/2+2*s);
  }

  // 2. Khối thông tin góc dưới trái
  ctx.textBaseline='alphabetic';
  ctx.font = `500 ${fs}px ${F}`;
  const lines = [d.date+' '+d.time];
  if(d.address) wrapLines(ctx, d.address, maxW).slice(0,3).forEach(l=>lines.push(l));
  if(d.lat==null) lines.push('Không có tọa độ GPS');
  if(d.note) wrapLines(ctx, 'Ghi chú: '+d.note, maxW).slice(0,3).forEach(l=>lines.push(l));
  if(d.user) lines.push('Người chụp: '+d.user);

  const blockH = lines.length*lineH;
  const top = h - m - blockH;
  // vạch màu bên trái
  ctx.fillStyle = '#ff6a2c'; ctx.fillRect(m, top+6*s, 6*s, blockH-4*s);
  ctx.shadowColor='rgba(0,0,0,0.75)'; ctx.shadowBlur=8*s; ctx.shadowOffsetY=2*s;
  ctx.fillStyle='#fff';
  lines.forEach((l,i)=>ctx.fillText(l, m+34*s, top + (i+1)*lineH - 14*s));
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  // 3. Logo (tùy chọn) ngay trên khối thông tin
  if(logoImg){
    const lh = 92*s, lw = Math.min(lh*logoImg.naturalWidth/logoImg.naturalHeight, w*0.4);
    const ly = top - lh - 34*s;
    ctx.fillStyle='#fff'; roundRect(ctx, m, ly, lw+28*s, lh+20*s, 8*s); ctx.fill();
    ctx.drawImage(logoImg, m+14*s, ly+10*s, lw, lh);
  }
  return c;
}

function drawPin(ctx, x, y, r){
  ctx.save(); ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x, y-r*0.35, r, Math.PI*0.85, Math.PI*0.15); ctx.lineTo(x, y+r*1.25); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(x, y-r*0.35, r*0.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function makeThumb(canvas){
  const t=document.createElement('canvas'); const k=104/Math.min(canvas.width,canvas.height);
  t.width=Math.round(canvas.width*k); t.height=Math.round(canvas.height*k);
  t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);
  return t.toDataURL('image/jpeg',0.6);
}
function shrink(canvas, max){
  const k=Math.min(1,max/Math.max(canvas.width,canvas.height));
  if(k===1) return new Promise(r=>canvas.toBlob(r,'image/jpeg',0.85));
  const t=document.createElement('canvas'); t.width=Math.round(canvas.width*k); t.height=Math.round(canvas.height*k);
  t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);
  return new Promise(r=>t.toBlob(r,'image/jpeg',0.85));
}
function blobToBase64(blob){
  return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
}

const Bridge = window.AndroidBridge || null;
async function saveBlob(blob, name){
  if(Bridge){ Bridge.saveImage(await blobToBase64(blob), name); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
$('saveBtn').addEventListener('click', ()=>{ if(current){ saveBlob(current.blob, current.fileName); if(!Bridge) toast('Đã lưu vào thư mục Tải xuống'); } });
window.onNativeToast = msg => toast(msg);
$('shareBtn').addEventListener('click', async ()=>{
  if(!current) return;
  if(Bridge){ Bridge.shareImage(await blobToBase64(current.blob), current.fileName); return; }
  const f = new File([current.blob], current.fileName, {type:'image/jpeg'});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f]}); }catch(e){}
  } else toast('Máy không hỗ trợ chia sẻ, hãy dùng “Lưu ảnh”.');
});

/* ---------- Gửi Google Sheet ---------- */
function setSync(cls, msg){ const s=$('syncStatus'); s.className='status '+cls; s.textContent=msg; }

async function postSheet(payload){
  const j = parseJson(await http('POST', settings.url, JSON.stringify(payload)));
  if(!j.ok) throw new Error(j.error||'Lỗi không rõ');
  return j;
}

async function send(payload){
  if(!settings.url){
    setSync('warn','Chưa cài đường dẫn Google Sheet. Bản ghi được giữ lại, sẽ gửi khi bạn cài đặt.');
    enqueue(payload); return;
  }
  setSync('','Đang ghi vào Google Sheet…');
  try{
    await postSheet(payload);
    markHistory(payload.id,'sent');
    setSync('ok','Đã ghi vào Google Sheet'+(payload.image?' và lưu ảnh lên Drive':''));
  }catch(e){
    enqueue(payload);
    setSync('bad','Chưa gửi được ('+(navigator.onLine?e.message:'mất mạng')+'). Sẽ tự gửi lại khi có mạng.');
  }
}

function enqueue(p){
  queue = queue.filter(q=>q.id!==p.id); queue.push(p);
  if(!store.set('queue', queue)){            // hết dung lượng: bỏ ảnh, giữ dữ liệu
    queue = queue.map(q=>{ const c={...q}; delete c.image; return c; });
    store.set('queue', queue);
  }
  markHistory(p.id,'pending'); updateRetry();
}

let flushing=false;
async function flushQueue(){
  if(flushing || !queue.length || !settings.url || !navigator.onLine) return;
  flushing=true; let sent=0;
  for(const p of [...queue]){
    try{ await postSheet(p); queue=queue.filter(q=>q.id!==p.id); store.set('queue',queue); markHistory(p.id,'sent'); sent++; }
    catch(e){ break; }
  }
  flushing=false; updateRetry();
  if(sent) toast('Đã gửi bù '+sent+' bản ghi');
}
function updateRetry(){ $('retryBtn').hidden = !queue.length; $('queueCount').textContent='('+queue.length+')'; }
$('retryBtn').addEventListener('click', flushQueue);
window.addEventListener('online', flushQueue);

/* ---------- Lịch sử ---------- */
function saveHistory(){ if(!store.set('history',history)){ history=history.slice(0,8); store.set('history',history); } }
function markHistory(id, st){ const h=history.find(x=>x.id===id); if(h){ h.status=st; saveHistory(); renderHistory(); } }
function renderHistory(){
  const ul=$('hist'); ul.innerHTML='';
  $('histEmpty').hidden = history.length>0;
  history.forEach(h=>{
    const li=document.createElement('li');
    const img=document.createElement('img'); img.src=h.thumb||''; img.alt='';
    const d=document.createElement('div');
    const t=document.createElement('div'); t.className='t'; t.textContent=h.time;
    const a=document.createElement('div'); a.className='a'; a.textContent=h.address;
    d.append(t,a);
    const p=document.createElement('span'); p.className='pill '+(h.status==='sent'?'ok':'warn');
    p.innerHTML='<i></i>'; p.append(h.status==='sent'?'Đã gửi':'Chờ gửi');
    li.append(img,d,p); ul.append(li);
  });
}

/* ---------- Cài đặt ---------- */
function fillSettings(){ $('sUrl').value=settings.url; $('sUser').value=settings.user; $('sUpload').checked=settings.upload; $('sAutoSave').checked=settings.autoSave; $('testResult').textContent=''; }
$('openSettings').addEventListener('click', ()=>{ fillSettings(); $('settings').showModal(); });
$('settingsForm').addEventListener('submit', e=>{
  if(e.submitter && e.submitter.value==='save'){
    settings = {url:$('sUrl').value.trim(), user:$('sUser').value.trim(), upload:$('sUpload').checked, autoSave:$('sAutoSave').checked};
    store.set('settings', settings); toast('Đã lưu cài đặt'); flushQueue();
  }
});
$('testBtn').addEventListener('click', async ()=>{
  const url=$('sUrl').value.trim(); const r=$('testResult');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){ r.textContent='Đường dẫn phải dạng …/macros/s/…/exec'; return; }
  r.textContent='Đang kiểm tra…';
  try{ const j=parseJson(await http('GET', url)); r.textContent = j.ok ? 'Kết nối tốt: '+(j.sheet||'') : 'Lỗi: '+j.error; }
  catch(e){ r.textContent='Không kết nối được. Chi tiết: '+e.message; }
});

$('logoPick').addEventListener('click', ()=>$('logoFile').click());
$('logoClear').addEventListener('click', ()=>{ try{localStorage.removeItem('logo');}catch(e){} loadLogo(); });
$('logoFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const img=await loadImage(f); const k=Math.min(1,300/img.naturalHeight);
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(!store.set('logo', c.toDataURL('image/png'))) toast('Logo quá lớn'); loadLogo();
});

/* ---------- Khởi động ---------- */
loadLogo();
renderHistory(); updateRetry(); startGPS(); flushQueue();
if(!settings.url) setTimeout(()=>toast('Mở Cài đặt để dán đường dẫn Google Sheet'), 800);
})();
</script>
